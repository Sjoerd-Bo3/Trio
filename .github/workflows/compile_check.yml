name: Compile Check

# Lightweight compile-only check so a feature can be verified without spending
# an Xcode Cloud build. Builds the app for the iOS Simulator (no code signing)
# and surfaces compiler errors in the job summary. The second job builds with the
# optional iCloud backup capability switched on.

on:
  workflow_dispatch:
  push:
    branches:
      - ci/backup-restore
      - ci/**
    paths-ignore:
      - '**.md'
      - '**/README'
      - '**.txt'

concurrency:
  group: compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for Simulator
    runs-on: macos-26

    steps:
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            /Users/runner/Library/Developer/Xcode/DerivedData
            .build
          key: ${{ runner.os }}-trio-compile-${{ hashFiles('**/*.swift', '**/*.xcodeproj', '**/*.xcworkspace') }}
          restore-keys: |
            ${{ runner.os }}-trio-compile-
            ${{ runner.os }}-trio-

      - name: Build for testing (compile only)
        run: |
          set -o pipefail
          time xcodebuild build-for-testing \
            -workspace Trio.xcworkspace \
            -scheme "Trio Tests" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: Surface compiler errors
        if: failure()
        run: |
          echo "## ❌ Compile failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Show error/warning lines and a little context
          grep -nE "error:|warning:|Undefined symbol|cannot find|has no member" xcodebuild.log \
            | sed 's#'"$PWD"'/##g' \
            | head -200 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" xcodebuild.log | sed 's#'"$PWD"'/##g' | awk '!seen[$0]++' | head -60 \
            | while IFS= read -r line; do echo "::error::${line//%/%25}"; done || true

      - name: Save cache
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /Users/runner/Library/Developer/Xcode/DerivedData
            .build
          key: ${{ runner.os }}-trio-compile-${{ hashFiles('**/*.swift', '**/*.xcodeproj', '**/*.xcworkspace') }}

  build-icloud:
    name: Build for Simulator (iCloud backup enabled)
    runs-on: macos-26

    steps:
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            /Users/runner/Library/Developer/Xcode/DerivedData
            .build
          key: ${{ runner.os }}-trio-compile-icloud-${{ hashFiles('**/*.swift', '**/*.xcodeproj', '**/*.xcworkspace') }}
          restore-keys: |
            ${{ runner.os }}-trio-compile-icloud-
            ${{ runner.os }}-trio-compile-
            ${{ runner.os }}-trio-

      - name: Build for testing with ENABLE_ICLOUD_BACKUP=YES
        run: |
          set -o pipefail
          time xcodebuild build-for-testing \
            -workspace Trio.xcworkspace \
            -scheme "Trio Tests" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_ICLOUD_BACKUP=YES \
            2>&1 | tee xcodebuild.log

      - name: Surface compiler errors
        if: failure()
        run: |
          echo "## ❌ Compile failed (iCloud backup enabled)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nE "error:|warning:|Undefined symbol|cannot find|has no member" xcodebuild.log \
            | sed 's#'"$PWD"'/##g' \
            | head -200 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" xcodebuild.log | sed 's#'"$PWD"'/##g' | awk '!seen[$0]++' | head -60 \
            | while IFS= read -r line; do echo "::error::${line//%/%25}"; done || true

      - name: Save cache
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /Users/runner/Library/Developer/Xcode/DerivedData
            .build
          key: ${{ runner.os }}-trio-compile-icloud-${{ hashFiles('**/*.swift', '**/*.xcodeproj', '**/*.xcworkspace') }}
